name: Build macOS Beta App

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version label for the beta artifact (for example 0.3.0-beta.1)"
        required: false
        type: string

jobs:
  authorize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require successful CI gate for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/require_successful_ci_gate.sh

  build-and-release:
    needs: authorize
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Compute release metadata
        id: meta
        shell: bash
        env:
          GUESLI_RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "This workflow publishes branch builds only." >&2
            exit 1
          fi

          VERSION="$(./scripts/release_version.sh)"
          BUNDLE_VERSION="$(./scripts/build_native_app.sh --print-bundle-version "$VERSION")"
          SAFE_VERSION="$VERSION"
          TAG_NAME="beta-${SAFE_VERSION}-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="GooseLee Beta ${VERSION}"
          PRERELEASE="true"
          RELEASE_NOTES=$'Russian-first GooseLee / Гусли build: lightweight local meeting recording, transcription, and summaries with the optional Google Meet speaker bridge.\n\nThis build uses the stable self-signed Guesli Dev identity with local-only entitlements, so macOS privacy grants survive updates. It is not Apple-notarized; first launch may require System Settings > Privacy & Security > Open Anyway.'
          ASSET_SUFFIX="-selfsigned-unnotarized"

          APP_DIR="dist/Guesli.app"
          APP_ZIP="dist/GooseLee-${SAFE_VERSION}${ASSET_SUFFIX}.zip"
          DMG_PATH="dist/GooseLee-${SAFE_VERSION}${ASSET_SUFFIX}.dmg"
          EXTENSION_ZIP="dist/GooseLee-Meet-Speaker-Bridge-${SAFE_VERSION}.zip"

          {
            echo "version=$VERSION"
            echo "bundle_version=$BUNDLE_VERSION"
            echo "tag_name=$TAG_NAME"
            echo "release_title=$RELEASE_TITLE"
            echo "prerelease=$PRERELEASE"
            echo "app_dir=$APP_DIR"
            echo "app_zip=$APP_ZIP"
            echo "dmg_path=$DMG_PATH"
            echo "extension_zip=$EXTENSION_ZIP"
            echo "release_notes<<EOF"
            echo "$RELEASE_NOTES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Check browser extension
        run: |
          node --check browser-extension/guesli-meet-speaker/content.js
          node --test browser-extension/guesli-meet-speaker/content.test.js

      - name: Run Meet speaker tests
        run: |
          if [[ -f native/Guesli/Tests/GuesliTests/MeetSpeakerBridgeTests.swift ]]; then
            swift test --package-path native/Guesli --scratch-path "$RUNNER_TEMP/guesli-spm" --filter MeetSpeakerBridgeTests
          else
            echo "Meet speaker bridge tests are not present on this ref; skipping focused test step."
          fi

      - name: Build and validate LocalVQE runtime
        env:
          LOCALVQE_REPO: ${{ runner.temp }}/LocalVQE
          LOCALVQE_BUILD_DIR: ${{ runner.temp }}/localvqe-build
          GUESLI_LOCALVQE_LIB_DIR: ${{ runner.temp }}/localvqe/lib
        run: |
          ./scripts/build_localvqe.sh
          source ./scripts/localvqe_runtime.sh
          guesli_localvqe_runtime_is_complete "$GUESLI_LOCALVQE_LIB_DIR"

      - name: Install Guesli signing identity
        timeout-minutes: 2
        env:
          SIGNING_P12_BASE64: ${{ secrets.GUESLI_SIGNING_P12_BASE64 }}
          SIGNING_P12_PASSWORD: ${{ secrets.GUESLI_SIGNING_P12_PASSWORD }}
        run: |
          test -n "$SIGNING_P12_BASE64"
          test -n "$SIGNING_P12_PASSWORD"
          CERTIFICATE_PATH="$RUNNER_TEMP/Guesli-Dev.p12"
          CERTIFICATE_PEM="$RUNNER_TEMP/Guesli-Dev.pem"
          KEYCHAIN_PATH="$RUNNER_TEMP/guesli-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          printf '%s' "$SIGNING_P12_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$SIGNING_P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security find-certificate -c "Guesli Dev" -p "$KEYCHAIN_PATH" > "$CERTIFICATE_PEM"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain "$CERTIFICATE_PEM"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          rm -f "$CERTIFICATE_PATH" "$CERTIFICATE_PEM"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -F '358AF852086E36AA4924D01D84B47F462776D496 "Guesli Dev"'

      - name: Build app bundle
        env:
          GUESLI_INSTALL_DIR: ${{ github.workspace }}/dist
          GUESLI_BUILD_VERSION: ${{ steps.meta.outputs.version }}
          GUESLI_BUNDLE_VERSION: ${{ steps.meta.outputs.bundle_version }}
          GUESLI_SHORT_VERSION: ${{ steps.meta.outputs.version }}
          GUESLI_APP_NAME: Guesli
          GUESLI_DISPLAY_NAME: GooseLee
          GUESLI_APP_BUNDLE_NAME: Guesli.app
          GUESLI_EXECUTABLE_NAME: Guesli
          GUESLI_SUPPORT_DIR_NAME: Guesli
          GUESLI_BUNDLE_ID: com.guesli.app
          GUESLI_SPARKLE_FEED_URL: https://raw.githubusercontent.com/ivkiwi/gooselee/sparkle-feed/docs/appcast-guesli.xml
          GUESLI_SPARKLE_EDKEY: x1xV1WAX32xkX4Yl4dxV9HctwCP/dm/K/9YUzWxk7Kc=
          GUESLI_ENTITLEMENTS: ${{ github.workspace }}/scripts/GuesliLocalOnly.entitlements
          GUESLI_SKIP_SIGN: "1"
          GUESLI_SIGN_IDENTITY: Guesli Dev
          GUESLI_SWIFTPM_SCRATCH_PATH: ${{ runner.temp }}/guesli-spm
          GUESLI_LOCALVQE_LIB_DIR: ${{ runner.temp }}/localvqe/lib
          GUESLI_REQUIRE_LOCALVQE: "1"
        run: ./scripts/build_native_app.sh release

      - name: Verify packaged app
        shell: bash
        run: |
          APP_DIR="${{ steps.meta.outputs.app_dir }}"
          APP_EXECUTABLE="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP_DIR/Contents/Info.plist")"
          APP_BIN="$APP_DIR/Contents/MacOS/$APP_EXECUTABLE"
          ENTITLEMENTS_PLIST="$RUNNER_TEMP/guesli-entitlements.plist"

          test -d "$APP_DIR"
          test -x "$APP_BIN"
          test -x "$APP_DIR/Contents/MacOS/guesli-cli"
          test -x "$APP_DIR/Contents/MacOS/onnx-gigaam-helper"
          find "$APP_DIR/Contents/MacOS" -maxdepth 1 -name 'libonnxruntime*.dylib' \( -type f -o -type l \) | grep -q .
          otool -L "$APP_DIR/Contents/MacOS/onnx-gigaam-helper" | grep -Fq 'libonnxruntime'
          source ./scripts/localvqe_runtime.sh
          guesli_localvqe_runtime_is_complete "$APP_DIR/Contents/MacOS"

          codesign --verify --deep --strict --verbose=2 "$APP_DIR"
          codesign -dvv "$APP_DIR" 2>&1 | grep -F 'Authority=Guesli Dev'
          codesign -d -r- "$APP_DIR" 2>&1 | grep -F 'designated => identifier "com.guesli.app" and certificate leaf = H"358af852086e36aa4924d01d84b47f462776d496"'
          codesign -d --entitlements :- "$APP_DIR" > "$ENTITLEMENTS_PLIST"

          if /usr/libexec/PlistBuddy -c 'Print :com.apple.developer.icloud-services' "$ENTITLEMENTS_PLIST" >/dev/null 2>&1; then
            echo "ERROR: self-signed Guesli release must not include CloudKit entitlements." >&2
            cat "$ENTITLEMENTS_PLIST" >&2
            exit 1
          fi

          if /usr/libexec/PlistBuddy -c 'Print :com.apple.developer.icloud-container-identifiers' "$ENTITLEMENTS_PLIST" >/dev/null 2>&1; then
            echo "ERROR: self-signed Guesli release must not include iCloud container entitlements." >&2
            cat "$ENTITLEMENTS_PLIST" >&2
            exit 1
          fi

          "$APP_DIR/Contents/MacOS/guesli-cli" spec >/dev/null

      - name: Package app zip
        run: |
          APP_ZIP="${{ steps.meta.outputs.app_zip }}"
          mkdir -p "$(dirname "$APP_ZIP")"
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent "${{ steps.meta.outputs.app_dir }}" "$APP_ZIP"

      - name: Create DMG
        run: |
          STAGING="$(mktemp -d)"
          cp -R "${{ steps.meta.outputs.app_dir }}" "$STAGING/"
          ln -s /Applications "$STAGING/Applications"
          hdiutil create -volname "GooseLee" -srcfolder "$STAGING" -ov -format UDZO "${{ steps.meta.outputs.dmg_path }}"
          rm -rf "$STAGING"

      - name: Package Meet speaker extension
        run: |
          EXTENSION_ZIP="${{ steps.meta.outputs.extension_zip }}"
          if [[ -d browser-extension/guesli-meet-speaker ]]; then
            mkdir -p "$(dirname "$EXTENSION_ZIP")"
            /usr/bin/ditto -c -k --keepParent browser-extension/guesli-meet-speaker "$EXTENSION_ZIP"
          else
            echo "Meet speaker extension is not present on this ref; skipping extension package."
          fi

      - name: Upload app artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GooseLee-macos
          path: |
            ${{ steps.meta.outputs.dmg_path }}
            ${{ steps.meta.outputs.app_zip }}
          compression-level: 0

      - name: Upload Meet speaker extension artifact
        if: hashFiles('browser-extension/guesli-meet-speaker/content.js') != ''
        uses: actions/upload-artifact@v4
        with:
          name: GooseLee-Meet-Speaker-Bridge
          path: |
            ${{ steps.meta.outputs.extension_zip }}
          compression-level: 0

      - name: Create draft GitHub release and upload assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${{ steps.meta.outputs.tag_name }}"
          RELEASE_TITLE="${{ steps.meta.outputs.release_title }}"
          DMG="${{ steps.meta.outputs.dmg_path }}"
          APP_ZIP="${{ steps.meta.outputs.app_zip }}"
          EXTENSION_ZIP="${{ steps.meta.outputs.extension_zip }}"
          NOTES_FILE="$(mktemp)"
          cat > "$NOTES_FILE" <<'EOF'
          ${{ steps.meta.outputs.release_notes }}
          EOF

          if ! gh release view "$TAG_NAME" >/dev/null 2>&1; then
            GH_ARGS=(
              "$TAG_NAME"
              --draft
              --title "$RELEASE_TITLE"
              --notes-file "$NOTES_FILE"
              --target "$GITHUB_SHA"
            )
            if [[ "${{ steps.meta.outputs.prerelease }}" == "true" ]]; then
              GH_ARGS+=(--prerelease)
            fi
            gh release create "${GH_ARGS[@]}"
          fi
          ASSETS=("$DMG" "$APP_ZIP")
          if [[ -f "$EXTENSION_ZIP" ]]; then
            ASSETS+=("$EXTENSION_ZIP")
          fi
          gh release upload "$TAG_NAME" "${ASSETS[@]}" --clobber

      - name: Verify hosted DMG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.meta.outputs.tag_name }}
          DMG_PATH: ${{ steps.meta.outputs.dmg_path }}
        run: |
          HOSTED_DIR="$RUNNER_TEMP/hosted-release"
          mkdir -p "$HOSTED_DIR"
          gh release download "$TAG_NAME" --repo "$GITHUB_REPOSITORY" \
            --pattern "$(basename "$DMG_PATH")" --dir "$HOSTED_DIR" --clobber
          test "$(shasum -a 256 "$DMG_PATH" | awk '{print $1}')" = \
            "$(shasum -a 256 "$HOSTED_DIR/$(basename "$DMG_PATH")" | awk '{print $1}')"

      - name: Generate and validate append-only Sparkle appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          TAG_NAME: ${{ steps.meta.outputs.tag_name }}
          DMG_PATH: ${{ steps.meta.outputs.dmg_path }}
          BUNDLE_VERSION: ${{ steps.meta.outputs.bundle_version }}
          SHORT_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          test -n "$SPARKLE_PRIVATE_KEY"
          UPDATES_DIR="$RUNNER_TEMP/guesli-sparkle"
          mkdir -p "$UPDATES_DIR"
          cp "$DMG_PATH" "$UPDATES_DIR/"
          GENERATE_APPCAST="$RUNNER_TEMP/guesli-spm/artifacts/sparkle/Sparkle/bin/generate_appcast"
          printf '%s' "$SPARKLE_PRIVATE_KEY" | "$GENERATE_APPCAST" \
            --ed-key-file - \
            --download-url-prefix "https://github.com/ivkiwi/gooselee/releases/download/${TAG_NAME}/" \
            --link "https://github.com/ivkiwi/gooselee/releases" \
            -o "$UPDATES_DIR/generated-appcast.xml" \
            "$UPDATES_DIR"
          git fetch origin sparkle-feed
          git show origin/sparkle-feed:docs/appcast-guesli.xml > "$RUNNER_TEMP/existing-appcast.xml"
          ASSET_URL="https://github.com/ivkiwi/gooselee/releases/download/${TAG_NAME}/$(basename "$DMG_PATH")"
          python3 ./scripts/merge_appcast_item.py \
            --existing "$RUNNER_TEMP/existing-appcast.xml" \
            --generated "$UPDATES_DIR/generated-appcast.xml" \
            --version "$BUNDLE_VERSION" \
            --download-url "$ASSET_URL" \
            --output "$RUNNER_TEMP/appcast-guesli.xml"
          ./scripts/verify_update_flow.sh \
            --appcast "$RUNNER_TEMP/appcast-guesli.xml" \
            --dmg "$RUNNER_TEMP/hosted-release/$(basename "$DMG_PATH")" \
            --version "$BUNDLE_VERSION" \
            --short-version "$SHORT_VERSION" \
            --app-name Guesli \
            --asset-url "$ASSET_URL" \
            --legacy-asset-url-prefix https://github.com/ivkiwi/guesli/releases/download/ \
            --require-runtimes \
            --self-signed-artifact

          FORGED_APPCAST="$RUNNER_TEMP/forged-appcast-guesli.xml"
          cp "$RUNNER_TEMP/appcast-guesli.xml" "$FORGED_APPCAST"
          python3 - "$FORGED_APPCAST" <<'PY'
          import base64
          import sys
          import xml.etree.ElementTree as ET

          path = sys.argv[1]
          tree = ET.parse(path)
          enclosure = tree.getroot().find("channel/item/enclosure")
          if enclosure is None:
              raise SystemExit("latest appcast enclosure missing")
          enclosure.set(
              "{http://www.andymatuschak.org/xml-namespaces/sparkle}edSignature",
              base64.b64encode(bytes(64)).decode(),
          )
          tree.write(path, encoding="utf-8", xml_declaration=True)
          PY
          if ./scripts/verify_update_flow.sh \
            --appcast "$FORGED_APPCAST" \
            --dmg "$RUNNER_TEMP/hosted-release/$(basename "$DMG_PATH")" \
            --version "$BUNDLE_VERSION" \
            --short-version "$SHORT_VERSION" \
            --app-name Guesli \
            --asset-url "$ASSET_URL" \
            --legacy-asset-url-prefix https://github.com/ivkiwi/guesli/releases/download/ \
            --require-runtimes \
            --self-signed-artifact; then
            echo "ERROR: forged Sparkle signature was accepted." >&2
            exit 1
          fi

      - name: Publish verified GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.meta.outputs.tag_name }}
        run: gh release edit "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease

      - name: Publish Sparkle appcast
        run: |
          git checkout -B sparkle-feed origin/sparkle-feed
          mkdir -p docs
          cp "$RUNNER_TEMP/appcast-guesli.xml" docs/appcast-guesli.xml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/appcast-guesli.xml
          git diff --cached --quiet || git commit -m "Update Guesli Sparkle appcast"
          git push origin "HEAD:sparkle-feed"
